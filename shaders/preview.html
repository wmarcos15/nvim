<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shader preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #16181a; color: #7b8496; font: 13px ui-monospace, Menlo, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; left: 12px; bottom: 10px; padding: 4px 8px; background: #16181acc; border: 1px solid #3c4048; border-radius: 3px; }
  #bar b { color: #5ef1ff; } #err { color: #ff6e5e; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"><b id="name"></b> &middot; browser preview of a Ghostty shader &middot; <span id="err"></span></div>
<script>
// Runs a shader from this folder the way Ghostty would, over a fake screen of
// code, so you can tune it without restarting anything.
//   preview.html                 -> hud.glsl
//   preview.html?shader=foo.glsl -> foo.glsl
// Needs to be served over http (fetch does not work from file://):
//   python3 -m http.server --directory ~/.config/nvim/shaders 8766
const file = new URLSearchParams(location.search).get("shader") || "hud.glsl";
const BG = [0x16 / 255, 0x18 / 255, 0x1a / 255];
document.getElementById("name").textContent = file;

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2");
const fail = msg => { document.getElementById("err").textContent = msg; };

// A fake Neovim screen: background colour, some "code", a cursor line and a statusline.
function fakeTerminal(w, h) {
  const t = document.createElement("canvas"); t.width = w; t.height = h;
  const c = t.getContext("2d");
  c.fillStyle = "#16181a"; c.fillRect(0, 0, w, h);
  const size = Math.round(15 * devicePixelRatio), lh = Math.round(size * 1.45);
  c.font = `${size}px ui-monospace, Menlo, monospace`; c.textBaseline = "top";
  const code = [
    ["#5ef1ff", "local "], ["#c9dde6", "function "], ["#4da3ff", "apply"], ["#c9dde6", "(slot)"], null,
    ["#5f7a88", "    -- switch the theme, then tell the terminal"], null,
    ["#5ef1ff", "    if "], ["#c9dde6", "slot.shader "], ["#5ef1ff", "then"], null,
    ["#4da3ff", "        terminal.animate"], ["#c9dde6", "("], ["#ffb86b", '"cyber-grid.glsl"'], ["#c9dde6", ")"], null,
    ["#5ef1ff", "    end"], null,
    ["#4da3ff", "    vim.notify"], ["#c9dde6", "("], ["#ffb86b", '"Theme: "'], ["#c9dde6", " .. slot.name)"], null,
    ["#5ef1ff", "end"], null,
  ];
  let x = size * 3.5, y = lh * 2, n = 1;
  const lineNo = () => { c.fillStyle = "#3c4048"; c.fillText(String(n++).padStart(3), size * 0.6, y); };
  c.fillStyle = "#1a2127"; c.fillRect(0, y + lh * 3, w, lh);        // cursor line
  for (let rep = 0; rep < 5; rep++) {
    lineNo();
    for (const tok of code) {
      if (!tok) { x = size * 3.5; y += lh; if (y < h - lh * 3) lineNo(); continue; }
      c.fillStyle = tok[0]; c.fillText(tok[1], x, y); x += c.measureText(tok[1]).width;
    }
    y += lh;
  }
  c.fillStyle = "#1e2124"; c.fillRect(0, h - lh, w, lh);            // statusline
  c.fillStyle = "#5ef1ff"; c.fillRect(0, h - lh, size * 6, lh);
  c.fillStyle = "#16181a"; c.fillText(" NORMAL", size * 0.4, h - lh + size * 0.2);
  c.fillStyle = "#5f7a88"; c.fillText("lua/core/themes.lua", size * 7, h - lh + size * 0.2);
  return t;
}

fetch(file, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(file + ": " + r.status); return r.text(); }).then(src => {
  const frag = `#version 300 es
precision highp float;
uniform vec3 iResolution; uniform float iTime; uniform sampler2D iChannel0; uniform vec3 iBackgroundColor;
out vec4 outColor;
${src}
void main() { mainImage(outColor, gl_FragCoord.xy); }`;
  const vert = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
  const compile = (type, text) => {
    const s = gl.createShader(type); gl.shaderSource(s, text); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const tex = gl.createTexture();
  function resize() {
    canvas.width = Math.round(innerWidth * devicePixelRatio); canvas.height = Math.round(innerHeight * devicePixelRatio);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fakeTerminal(canvas.width, canvas.height));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  resize(); addEventListener("resize", resize);

  const u = n => gl.getUniformLocation(prog, n);
  // ?t=12.5 freezes time at that second (for screenshots)
  const frozen = new URLSearchParams(location.search).get("t");
  const start = performance.now();
  (function frame() {
    gl.uniform3f(u("iResolution"), canvas.width, canvas.height, 1);
    gl.uniform1f(u("iTime"), frozen !== null ? +frozen : (performance.now() - start) / 1000);
    gl.uniform3f(u("iBackgroundColor"), ...BG);
    gl.uniform1i(u("iChannel0"), 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  })();
  window.shaderOK = true;
}).catch(e => { window.shaderOK = false; fail(String(e.message || e)); });
</script>
</body>
</html>
